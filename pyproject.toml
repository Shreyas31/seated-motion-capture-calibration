[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    ".venv",
    "dist",
    "generated",
    "out",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["frontend/tests"]
addopts = ["-v"]
